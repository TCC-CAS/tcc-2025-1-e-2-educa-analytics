<div class="disciplina-form-page">

  <!-- Modal de Confirmação de Edição -->
  <div class="modal-overlay" *ngIf="confirmVisible" (click)="cancelConfirm()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h3 class="modal-title">Confirmar edição</h3>
      <p class="modal-message">Deseja realmente salvar as alterações desta disciplina?</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-cancel" (click)="cancelConfirm()">Cancelar</button>
        <button type="button" class="modal-btn modal-confirm" (click)="confirmEdit()">Confirmar</button>
      </div>
    </div>
  </div>

  <button type="button" class="btn-voltar" (click)="cancel()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar para lista de disciplinas
  </button>

  <div class="form-wrapper">
  <header class="page-header">
    <div>
      <h1>{{ disciplinaId ? 'Editar disciplina' : 'Cadastrar disciplina' }}</h1>
      <p>Informe os dados da disciplina para salvar as alterações.</p>
    </div>
  </header>

  <div class="message" *ngIf="message" [class.error]="messageType === 'error'">
    {{ message }}
  </div>

  <form #form="ngForm" class="form" (ngSubmit)="submit(form.valid === true)">
    <div class="field-grid">
      <label class="field">
        <span>Disciplina</span>
        <select name="nome" [(ngModel)]="model.nome" (ngModelChange)="onNomeChange()" required>
          <option value="">Selecione</option>
          <option *ngFor="let d of disciplinasOpcoes" [value]="d.nome">{{ d.nome }}</option>
        </select>
      </label>
      <label class="field">
        <span>Código</span>
        <input type="text" name="codigo" [(ngModel)]="model.codigo" required maxlength="20" />
      </label>
    </div>

    <div class="field-grid">
      <label class="field">
        <span>Status</span>
        <select name="status" [(ngModel)]="model.status" required>
          <option value="">Selecione</option>
          <option value="ativa">Ativa</option>
          <option value="inativa">Inativa</option>
        </select>
      </label>
    </div>

    <div class="field-grid">
      <label class="field full-width">
        <span>Descrição (opcional)</span>
        <textarea name="descricao" [(ngModel)]="model.descricao" rows="3" placeholder="Informações adicionais sobre a disciplina..."></textarea>
      </label>
    </div>

    <div class="form-actions">
      <button type="button" class="ghost" (click)="cancel()" [disabled]="isLoading">Voltar</button>
      <button type="submit" class="primary" [disabled]="isLoading">
        {{ isLoading ? 'Salvando...' : (disciplinaId ? 'Salvar Alterações' : 'Cadastrar disciplina') }}
      </button>
    </div>
  </form>
  </div>
</div>
